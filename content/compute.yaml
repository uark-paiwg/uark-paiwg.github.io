# https://www.ou.edu/content/dam/oscer/docs/oklahomapetastore_use_agreement.docx
- id: ou-ourrstore
  title: OU & Regional Research Store (OURRstore)
  provider: University of Oklahoma — OSCER
  type: Research storage
  summary: Subsidized tape archiving for large research datasets, potentially useful for preserving simulation outputs and scientific machine-learning datasets.
  eligibility: Employees and students at noncommercial research or educational institutions in Arkansas are eligible. Commercial firms and institutions outside the United States are excluded.
  access: Request an OSCER account for OURRstore and submit the use agreement. Consult OSCER before purchasing at least two approved LTO-9 tapes, then complete training. Users pay media and shipping costs, with no recurring usage charges.
  status: Rolling
  url: https://www.ou.edu/oscer/storage/ourrstore--ou---regional-research-store
  last_checked: "2026-11-03"
  details:
    - "Published approximate media costs are $200 minimum and $13 per usable TB for two copies; shipping and applicable grant indirect costs are additional."
    - "Non-OU users must provide prepaid return shipping for their secondary tape copy. Capacity depends on purchased media and available slots."
    - "Expected service lifetime extends to approximately 2031; this is not an application deadline."
    - "Only nonclinical, legally unregulated STEM research data is permitted. Files must be 1 GB–1 TB. An OURRstore-only account does not provide supercomputer access."

# Grant eligibility and personal-account application route:
# https://github.com/huggingface/skills/blob/main/skills/huggingface-spaces/references/grants.md
# Paid-plan requirements and exceptions: https://huggingface.co/docs/hub/spaces-overview
# Free-account conditions and shared-GPU quotas: https://huggingface.co/docs/hub/spaces-zerogpu
- id: hugging-face-community-gpu-grants
  title: Hugging Face Community GPU Grants
  provider: Hugging Face
  type: Research hosting
  summary: GPU hosting for selected public AI demos. Potential uses include sharing scientific machine-learning models, interactive research results, and educational tools.
  eligibility: Researchers and students with public, open-source demos may request support when they cannot cover the hardware costs. Private, commercial, and closed-source projects are excluded by the grant guidance.
  access: Selected Spaces receive free GPU hosting. Personal-account applicants without a paid plan can upload app code to a free Static Space and request ZeroGPU support in its Community tab; the app can switch to Gradio after approval. Hardware and award duration are discretionary.
  status: Rolling
  url: https://huggingface.co/docs/hub/spaces-gpus#community-gpu-grants
  last_checked: "2026-11-03"
  details:
    - "Grants support public demos beyond the ordinary free ZeroGPU allowance or needing dedicated hardware. They cover the approved Space, not general-purpose GPU jobs or other paid services."
    - "Ordinary new Gradio or Docker Spaces require paid PRO for personal accounts or Team/Enterprise for organizations. The documented personal ZeroGPU grant route avoids PRO; institutional subscriptions are not included. Dedicated-GPU applicants must prepare a running app, which may require a paid plan."
    - "The ordinary free allowance is two personal ZeroGPU Spaces, requiring a verified email and an account older than 30 days. ZeroGPU uses shared GPUs, supports Gradio apps, and applies daily usage quotas."
    - "Standard ZeroGPU use includes five GPU minutes per day for free accounts. Paid-plan users exceeding their included quota automatically consume prepaid credits at $1 per 10 GPU minutes. A hosting grant does not promise a quota exemption."
    - "Paid hardware outside the grant is billed by runtime, including idle time. Pause the Space or return it to free CPU hardware to stop those hardware charges."
